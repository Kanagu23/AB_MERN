<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Weather APP</h1>
        <div class="search-box">
            <input type="text" name="" id="cityInput" placeholder="Enter the city">
            <button id="searchBtn">
                Search
            </button>
        </div>
        <div class="weather-box" id="weatherBox">
            <h2 id="cityTitle"></h2>
        <img src="" alt="" id="icon">
        <p id="iconDesc"></p>
            <h1 class="degree"><span id="degNum"></span><sup>&deg</sup>C</h1>
            <p>
                Min: <span id="minDeg"></span>
                Max: <span id="maxDeg"></span>
            </p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
